# Copy to config.yaml and fill in. config.yaml is gitignored.

google_sheet_id: "PUT_SHEET_ID_HERE"        # the long id from the sheet URL
google_worksheet_name: "Sheet1"
google_credentials_file: "credentials.json"   # service account JSON key

openai_api_key: "sk-..."      # transcription + extraction; or set env OPENAI_API_KEY

transcription_model: "whisper-1"       # or "gpt-4o-transcribe" (better on noisy calls)
extraction_model: "gpt-5.1"            # or "gpt-5.2" / "gpt-4.1" (4.1 is cheaper, a bit more prone to guessing)
extraction_max_tokens: 8000
